<script>
function getInviteCode() {
    var url = window.location.href;
    var channelIdStart = url.indexOf('channelId/') + 10; // Length of 'channelId/'
    var channelIdEnd = url.indexOf('/top/');
    var channelId = url.substring(channelIdStart, channelIdEnd);
    
    var inviteCodeStart = channelIdEnd + 5; // Length of '/top/'
    var inviteCodeEnd = url.indexOf('.html');
    var inviteCode = url.substring(inviteCodeStart, inviteCodeEnd);
    
    return inviteCode;
}

}

// update btn
var timeLeft = 60;

function countdown() {

function register(){
  
        
        var pwd = $("#pwd").val();
        var pwd2 = $("#pwd2").val();
        
        
    if(!$("#phone").val()){

    }
    
    
    
     if(pwd.length < 6 || pwd.length > 16){
           Toast("Please enter a password of 6-16 characters");
            return false;
        }
  
   if(pwd != pwd2){

            return false;
            
        }

 var json='{"type":"register","phone":"'+$("#phone").val()+'","otp":"'+$("#smscode").val()+'","password":"'+$("#pwd").val()+'","id":"'+$("#invite_code").val()+'"}';
