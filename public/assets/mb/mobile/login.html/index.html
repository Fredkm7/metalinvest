    <script>
  

 function login(){
        

        if(!$("#phone").val()){
  Toast('Enter Number');return;
}
if(!$("#password").val()){
Toast('Enter Password');return;
}
    var json='{"type":"login","phone":"'+$("#phone").val()+'","password":"'+$("#password").val()+'"}';
   

    $.ajax({
        type:"post",
url:"login.php",
data:json,
success:function(op){
   
   var res=JSON.parse(op);
   var rescode=res.code;
   var msg=res.msg
Toast(msg);
if(rescode=='200'){
    setTimeout(() => {
         location.href='/mobile/index'
    }, 800);
}
}
    })


    }
       
    </script>
